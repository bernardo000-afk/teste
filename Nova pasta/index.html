<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Tempo</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    #contador {
      font-size: 1.8rem;
      font-weight: bold;
      color: #e94560;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px 30px;
      border-radius: 15px;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    p {
      margin-top: 20px;
      font-size: 1rem;
      opacity: 0.8;
      max-width: 400px;
      padding: 0 20px;
    }

    .coracao {
      position: absolute;
      color: #e94560;
      font-size: 20px;
      pointer-events: none;
      animation: subir 3s linear forwards;
    }

    @keyframes subir {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1>Estamos juntos há:</h1>
  <div id="contador">Calculando...</div>
  <p id="mensagem">"Cada segundo ao seu lado faz tudo valer a pena."<br><small>(Clique em qualquer lugar da tela)</small></p>

  <script>
    // 1. Defina a data de início (Ano, Mês - 1, Dia, Hora, Minuto)
    // Exemplo: 14 de Fevereiro de 2024 às 20:00 (Mês 1 = Fevereiro)
    const dataInicio = new Date(2024, 1, 14, 20, 0, 0);

    function atualizarContador() {
      const agora = new Date();
      const diferenca = agora - dataInicio;

      const segundosTotais = Math.floor(diferenca / 1000);
      const dias = Math.floor(segundosTotais / (3600 * 24));
      const horas = Math.floor((segundosTotais % (3600 * 24)) / 3600);
      const minutos = Math.floor((segundosTotais % 3600) / 60);
      const segundos = segundosTotais % 60;

      document.getElementById('contador').innerText = 
        `${dias}d ${horas}h ${minutos}m ${segundos}s`;
    }

    // Atualiza a cada 1 segundo
    setInterval(atualizarContador, 1000);
    atualizarContador();

    // 2. Interatividade: Cria corações flutuantes ao clicar
    document.addEventListener('click', (e) => {
      const coracao = document.createElement('div');
      coracao.classList.add('coracao');
      coracao.innerText = '❤️';
      coracao.style.left = `${e.clientX}px`;
      coracao.style.top = `${e.clientY}px`;
      
      document.body.appendChild(coracao);

      // Remove o elemento do DOM após a animação terminar para não pesar na memória
      setTimeout(() => {
        coracao.remove();
      }, 3000);
    });
  </script>
</body>
</html>
